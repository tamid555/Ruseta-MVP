      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ffffff" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#e0f7ff" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Cuerpo del pin con borde neón blanco -->
  <path d="M24 6C16.5 6 10.5 12 10.5 19.5c0 9.5 13.5 21.5 13.5 21.5s13.5-12 13.5-21.5C37.5 12 31.5 6 24 6z" fill="#0f172a" stroke="#ffffff" stroke-width="2.5" filter="url(#neonBlanco)" />
  
