<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <!-- Filtro de resplandor neón que no se recorta en los bordes -->
    <filter id="neonCian" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00d2ff" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#a6e4ff" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Cuerpo del pin con borde neón brillante -->
  <path d="M24 6C16.5 6 10.5 12 10.5 19.5c0 9.5 13.5 21.5 13.5 21.5s13.5-12 13.5-21.5C37.5 12 31.5 6 24 6z" fill="#0f172a" stroke="#00d2ff" stroke-width="2.5" filter="url(#neonCian)" />
  
  <!-- Círculo interior -->
  <circle cx="24" cy="19" r="8" fill="#00d2ff" opacity="0.15" />
  
  <!-- Letra A luminosa -->
  <text x="24" y="23" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#00d2ff" text-anchor="middle">A</text>
</svg>