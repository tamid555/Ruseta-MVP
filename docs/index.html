<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruseta - Cúcuta</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            
            <h1 class="logo-text">RUSETA</h1>
            <p class="subtitle">Transporte y rutas en Cúcuta</p>

            <form id="loginForm">
                <div class="form-group">
                    
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                        <input type="email" id="email" placeholder="Correo electrónico" class="input-field">
                    </div>

                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                        <input type="password" id="password" placeholder="Contraseña" class="input-field">
                    </div>

                    <p id="msgError" class="msg-error"></p>

                    <div id="contenedorOlvidaste" style="display: none; text-align: center; margin-bottom: 10px;">
                        <a href="recuperar.html" style="color: #00d2ff; font-size: 0.85rem; text-decoration: none;">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="button" class="btn-primary" id="btnLogin">INICIAR SESIÓN</button>
                </div>

                <div class="divider">O</div>

                <button type="button" class="btn-guest" id="btnGuest">Continuar como Invitado</button>
            </form>
            <p class="enlace-registro">¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p>

        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnLogin = document.getElementById('btnLogin');
            const msgError = document.getElementById('msgError');
            const contenedorOlvidaste = document.getElementById('contenedorOlvidaste');

            if (!btnLogin || !msgError || !contenedorOlvidaste) return;

            function actualizarVisibilidadEnlace() {
                const textoError = msgError.textContent.trim();
                if (textoError) {
                    contenedorOlvidaste.style.display = 'block';
                }
            }

            const observador = new MutationObserver(actualizarVisibilidadEnlace);
            observador.observe(msgError, { childList: true, characterData: true, subtree: true });

            btnLogin.addEventListener('click', () => {
                setTimeout(actualizarVisibilidadEnlace, 600);
            });
        });
    </script>
</body>
</html>
