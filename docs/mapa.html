<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ruseta - Mapa de Rutas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root { --ancho-barra: 360px; }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
        }

        /* El mapa ocupa toda la pantalla; dvh evita problemas con la barra del navegador en el celular */
        #mapa-cucuta {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #242f3e;
        }

        /* ---------- Botón de 3 líneas (hamburguesa) ---------- */
        .btn-menu {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 30;
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 10px;
            background: #00d2ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
        }

        .btn-menu span {
            display: block;
            width: 22px;
            height: 3px;
            border-radius: 2px;
            background: #0f172a;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        /* Cuando el menú está abierto, las 3 líneas se convierten en una X */
        body.menu-abierto .btn-menu span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        body.menu-abierto .btn-menu span:nth-child(2) { opacity: 0; }
        body.menu-abierto .btn-menu span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

        /* ---------- Barra lateral izquierda ---------- */
        .barra-lateral {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 40px;               /* deja libre el logo de Google en la esquina inferior izquierda */
            width: var(--ancho-barra);
            max-width: 100vw;
            z-index: 20;
            display: flex;
            flex-direction: column;
            background: rgba(15, 23, 42, 0.96);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-right-radius: 14px;
            box-shadow: 8px 0 24px rgba(0, 0, 0, 0.4);
            transform: translateX(-105%);
            transition: transform 0.3s ease;
        }

        body.menu-abierto .barra-lateral { transform: none; }

        .barra-cabecera {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 74px;
            padding: 14px 16px 14px 74px;   /* el espacio de la izquierda es para el botón de 3 líneas */
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo-barra {
            color: #00d2ff;
            font-weight: 800;
            letter-spacing: 3px;
            font-size: 1.05rem;
        }

        .btn-cerrar-sesion {
            background-color: #00d2ff;
            color: #0f172a;
            border: none;
            padding: 8px 12px;
            font-weight: bold;
            font-size: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-cerrar-sesion:hover {
            background-color: #3a86ff;
            color: #ffffff;
        }

        .barra-contenido {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
        }

        .bloque {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .bloque h3 {
            color: #ffffff;
            margin-bottom: 12px;
            font-size: 1rem;
        }

        .input-grupo {
            position: relative;
            margin-bottom: 10px;
        }

        /* Adaptación visual para el componente web de Google */
        gmp-place-autocomplete {
            width: 100%;
            --gmp-color-background: #1e293b;
            --gmp-color-text: #ffffff;
            --gmp-color-border: #334155;
            --gmp-border-radius: 8px;
            --gmp-box-shadow: none;
            font-size: 0.9rem;
        }

        .btn-trazar {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d2ff, #3a86ff);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 10px;
        }

        .btn-trazar:hover { opacity: 0.9; }

        .fila-botones { display: flex; gap: 8px; margin-bottom: 6px; }

        .btn-mini {
            flex: 1;
            min-height: 40px;
            padding: 8px;
            background: #1e293b;
            color: #ffffff;
            border: 1px solid #334155;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-mini:hover { border-color: #00d2ff; }

        .texto-punto {
            color: #a6e4ff;
            font-size: 0.8rem;
            margin-bottom: 12px;
            word-break: break-word;
        }

        /* ---------- Menú desplegable de Puntos de Interés ---------- */
        .poi-dropdown {
            margin-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 10px;
        }

        .btn-poi-toggle {
            width: 100%;
            min-height: 40px;
            padding: 8px 12px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s, background 0.2s;
        }

        .btn-poi-toggle:hover {
            border-color: #00d2ff;
            background: #253348;
        }

        .poi-lista {
            display: none;
            flex-direction: column;
            gap: 4px;
            margin-top: 6px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 6px;
            max-height: 170px;
            overflow-y: auto;
        }

        .poi-lista.abierto {
            display: flex;
        }

        .poi-item {
            background: transparent;
            border: none;
            color: #e2e8f0;
            padding: 8px 10px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            font-size: 0.82rem;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }

        .poi-item:hover {
            background: #1e293b;
            color: #00d2ff;
        }

        .poi-item small {
            color: #94a3b8;
            font-size: 0.72rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Resumen del resultado (se queda fijo, no desaparece) */
        .resumen {
            color: #ffffff;
            font-size: 0.88rem;
            line-height: 1.4;
            padding: 8px 10px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.04);
            border-left: 3px solid #00d2ff;
            border-radius: 6px;
        }

        /* Leyenda con casillas para mostrar u ocultar cada capa */
        .leyenda { display: flex; flex-direction: column; gap: 10px; }

        .leyenda-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            font-size: 0.82rem;
            cursor: pointer;
        }

        .leyenda-item input { accent-color: #00d2ff; width: 16px; height: 16px; flex-shrink: 0; }

        .linea-muestra { width: 28px; height: 4px; border-radius: 2px; flex-shrink: 0; }
        .muestra-blanca { background-color: #ffffff; opacity: 0.6; }
        .muestra-azul { background-color: #00d2ff; box-shadow: 0 0 6px rgba(0, 210, 255, 0.6); }
        .muestra-amarilla { height: 0; border-top: 4px dotted #ffd166; }

        /* ---------- Aviso temporal (se puede cerrar tocándolo) ---------- */
        .aviso-mapa {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            max-width: min(560px, calc(100vw - 100px));
            background: rgba(15, 23, 42, 0.95);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid #00d2ff;
            display: none;
            cursor: pointer;
            font-size: 0.9rem;
            line-height: 1.35;
        }

        body.menu-abierto .aviso-mapa { left: calc(50% + (var(--ancho-barra) / 2)); }

        /* Fondo oscuro detrás del menú (solo en el celular) */
        .velo-menu {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 19;
            background: rgba(0, 0, 0, 0.5);
        }

        /* ---------- Celulares y pantallas pequeñas ---------- */
        @media (max-width: 768px) {
            .barra-lateral { width: min(88vw, 360px); }
            body.menu-abierto .velo-menu { display: block; }

            /* El aviso pasa abajo para no taparse con el botón de 3 líneas */
            .aviso-mapa {
                top: auto;
                bottom: calc(18px + env(safe-area-inset-bottom));
                max-width: calc(100vw - 32px);
            }
            body.menu-abierto .aviso-mapa { left: 50%; }

            /* 16 px evita que el iPhone haga zoom al escribir en los campos */
            gmp-place-autocomplete { font-size: 16px; }
            .btn-mini, .btn-poi-toggle { min-height: 44px; font-size: 0.85rem; }
            .btn-trazar { padding: 14px; }
        }
    </style>
</head>
<body>

    <button class="btn-menu" id="btn-menu" aria-label="Mostrar u ocultar el menú" aria-expanded="true" aria-controls="barra-lateral">
        <span></span><span></span><span></span>
    </button>

    <aside class="barra-lateral" id="barra-lateral">
        <div class="barra-cabecera">
            <span class="logo-barra">RUSETA</span>
            <button class="btn-cerrar-sesion" onclick="cerrarSesion()">Cerrar sesión</button>
        </div>

        <div class="barra-contenido">
            <section class="bloque">
                <h3>Planifica tu viaje</h3>

                <div class="input-grupo" id="contenedor-origen"></div>
                <div class="fila-botones">
                    <button class="btn-mini" id="btn-origen-mapa">Elegir en el mapa</button>
                    <button class="btn-mini" id="btn-mi-ubicacion">Usar mi ubicación</button>
                </div>
                <div class="texto-punto" id="texto-origen">Origen: sin seleccionar</div>

                <div class="input-grupo" id="contenedor-destino"></div>
                <div class="fila-botones">
                    <button class="btn-mini" id="btn-destino-mapa">Elegir en el mapa</button>
                </div>
                <div class="texto-punto" id="texto-destino">Destino: sin seleccionar</div>

                <!-- MENÚ DESPLEGABLE DE PUNTOS DE INTERÉS -->
                <div class="poi-dropdown">
                    <button type="button" class="btn-poi-toggle" id="btn-toggle-poi" aria-expanded="false">
                        <span>📍 Puntos de Interés en Cúcuta</span>
                        <span id="flecha-poi">▾</span>
                    </button>
                    <div class="poi-lista" id="lista-poi">
                        <div style="color: #94a3b8; font-size: 0.8rem; padding: 8px; text-align: center;">
                            Cargando sitios de Google Maps...
                        </div>
                    </div>
                </div>

                <button class="btn-trazar" id="btn-buscar-ruta">Trazar Ruta</button>
            </section>

            <section class="bloque">
                <h3>Tu ruta</h3>
                <p class="resumen" id="resumen-ruta">Elige un origen y un destino y pulsa «Trazar Ruta».</p>

                <div class="leyenda">
                    <label class="leyenda-item">
                        <input type="checkbox" id="ver-directo" checked>
                        <span class="linea-muestra muestra-blanca"></span>
                        <span id="leyenda-directa">Trayecto directo (Punto A a B)</span>
                    </label>
                    <label class="leyenda-item">
                        <input type="checkbox" id="ver-buseta" checked>
                        <span class="linea-muestra muestra-azul"></span>
                        <span id="leyenda-buseta">Recorrido de la buseta</span>
                    </label>
                    <label class="leyenda-item">
                        <input type="checkbox" id="ver-caminata" checked>
                        <span class="linea-muestra muestra-amarilla"></span>
                        <span id="leyenda-caminata">Caminata a pie</span>
                    </label>
                </div>
            </section>
        </div>
    </aside>

    <div class="velo-menu" id="velo-menu"></div>
    <div class="aviso-mapa" id="aviso-mapa" title="Toca para cerrar"></div>

    <div id="mapa-cucuta"></div>

    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCnEK5NvabRa4y36ZJCeRjLmJforPtaK5w&libraries=places&v=weekly&callback=iniciarMapa"></script>

    <script>
        if (!sessionStorage.getItem('usuarioRuseta')) {
            window.location.href = 'index.html';
        }

        function cerrarSesion() {
            sessionStorage.removeItem('usuarioRuseta');
            window.location.href = 'index.html';
        }

        // ---------- Menú lateral (botón de 3 líneas) ----------
        const ABRIR_MENU_EN_MOVIL = false;   // true: en el celular también empieza abierto
        const esMovil = () => window.matchMedia('(max-width: 768px)').matches;

        function abrirMenu(abrir) {
            document.body.classList.toggle('menu-abierto', abrir);
            document.getElementById('btn-menu').setAttribute('aria-expanded', String(abrir));
            // El resumen ya se ve dentro del menú, así que se oculta el aviso (salvo el de "elige un punto en el mapa")
            const aviso = document.getElementById('aviso-mapa');
            if (abrir && !aviso.dataset.seleccion) aviso.style.display = 'none';
        }

        // Márgenes para que la ruta no quede tapada por el menú al encuadrar el mapa
        function margenesMapa() {
            if (esMovil()) return { top: 80, right: 30, bottom: 110, left: 30 };
            const abierto = document.body.classList.contains('menu-abierto');
            return { top: 60, right: 60, bottom: 60, left: abierto ? 420 : 80 };
        }

        // Casillas de la leyenda: mostrar u ocultar cada capa
        const visibilidad = { directo: true, buseta: true, caminata: true };

        function aplicarVisibilidad() {
            capas.forEach(c => c.setMap(visibilidad.directo ? mapa : null));
            capasBuseta.forEach(c => c.setMap(visibilidad.buseta ? mapa : null));
            capasCaminata.forEach(c => c.setMap(visibilidad.caminata ? mapa : null));
        }

        function reiniciarLeyenda() {
            document.getElementById('leyenda-directa').textContent = 'Trayecto directo (Punto A a B)';
            document.getElementById('leyenda-buseta').textContent = 'Recorrido de la buseta';
            document.getElementById('leyenda-caminata').textContent = 'Caminata a pie';
            escribirResumen('Elige un origen y un destino y pulsa «Trazar Ruta».', '#00d2ff');
        }

        document.getElementById('btn-menu').addEventListener('click', () =>
            abrirMenu(!document.body.classList.contains('menu-abierto')));
        document.getElementById('velo-menu').addEventListener('click', () => abrirMenu(false));
        document.getElementById('aviso-mapa').addEventListener('click', (e) => {
            if (modoSeleccion === null) e.currentTarget.style.display = 'none';
        });
        ['directo', 'buseta', 'caminata'].forEach(clave => {
            document.getElementById('ver-' + clave).addEventListener('change', (e) => {
                visibilidad[clave] = e.target.checked;
                aplicarVisibilidad();
            });
        });

        // En computador empieza abierto; en celular, cerrado para ver el mapa
        abrirMenu(!esMovil() || ABRIR_MENU_EN_MOVIL);

        let mapa;
        let directionsService;
        let directionsRenderer;
        
        let coordenadaOrigen = null;
        let coordenadaDestino = null;

        let iconOrigen, iconDestino, iconBuseta, iconCaminata;

        function crearMarcador(posicion, icono, titulo) {
            return new google.maps.Marker({
                position: posicion,
                map: mapa,
                icon: icono,
                title: titulo,
                animation: google.maps.Animation.DROP
            });
        }
        
        let modoSeleccion = null;
        const marcadoresPunto = { origen: null, destino: null };
        let marcadorUsuario = null;
        let idSeguimiento = null;

        function textoCoordenadas(p) {
            return p.lat().toFixed(5) + ', ' + p.lng().toFixed(5);
        }

        async function describirPunto(latLng) {
            try {
                const { results } = await new google.maps.Geocoder().geocode({ location: latLng });
                if (results && results[0]) return results[0].formatted_address;
            } catch (e) {
            }
            return textoCoordenadas(latLng);
        }

        function fijarPunto(cual, latLng, texto) {
            const esOrigen = cual === 'origen';
            if (esOrigen) coordenadaOrigen = latLng; else coordenadaDestino = latLng;

            if (marcadoresPunto[cual]) marcadoresPunto[cual].setMap(null);
            marcadoresPunto[cual] = crearMarcador(
                latLng, esOrigen ? iconOrigen : iconDestino, esOrigen ? 'Punto A' : 'Punto B'
            );

            document.getElementById('texto-' + cual).textContent =
                (esOrigen ? 'Origen: ' : 'Destino: ') + (texto || textoCoordenadas(latLng));
        }

        // ---------- Puntos de Interés en Cúcuta ----------
        function cerrarMenuPOI() {
            document.getElementById('lista-poi').classList.remove('abierto');
            document.getElementById('btn-toggle-poi').setAttribute('aria-expanded', 'false');
            document.getElementById('flecha-poi').textContent = '▾';
        }

        function elegirPOI(nombre, latLng) {
            fijarPunto('destino', latLng, nombre);
            mapa.panTo(latLng);
            mapa.setZoom(15);
            cerrarMenuPOI();
            anunciar('📍 Destino fijado en: ' + nombre, '#00d2ff');
        }

        function cargarPOIsRespaldo(listaEl) {
            const sitios = [
                { nombre: 'Centro Comercial Unicentro', dir: 'Av. Libertadores, Cúcuta', lat: 7.9045, lng: -72.4852 },
                { nombre: 'Centro Comercial Ventura Plaza', dir: 'Calle 10 #0-90, Cúcuta', lat: 7.8924, lng: -72.4975 },
                { nombre: 'Centro Comercial Jardín Plaza', dir: 'Anillo Vial Oriental, Cúcuta', lat: 7.9152, lng: -72.4918 },
                { nombre: 'Parque Santander', dir: 'Centro, Cúcuta', lat: 7.8914, lng: -72.5078 },
                { nombre: 'Terminal de Transportes', dir: 'Av. 7 #0N-10, Cúcuta', lat: 7.9123, lng: -72.4912 },
                { nombre: 'UFPS', dir: 'Av. Gran Colombia, Cúcuta', lat: 7.8984, lng: -72.4875 }
            ];
            listaEl.innerHTML = '';
            sitios.forEach(s => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'poi-item';
                btn.innerHTML = `<strong>${s.nombre}</strong><small>${s.dir}</small>`;
                btn.addEventListener('click', () => {
                    elegirPOI(s.nombre, new google.maps.LatLng(s.lat, s.lng));
                });
                listaEl.appendChild(btn);
            });
        }

        async function cargarPuntosDeInteresGoogle() {
            const listaEl = document.getElementById('lista-poi');
            try {
                const { Place } = await google.maps.importLibrary("places");
                const request = {
                    textQuery: 'Centros comerciales parques universidades y sitios turisticos en Cucuta Colombia',
                    fields: ['displayName', 'location', 'formattedAddress'],
                    locationBias: { lat: 7.89391, lng: -72.50782 },
                    maxResultCount: 10
                };

                const { places } = await Place.searchByText(request);

                if (places && places.length > 0) {
                    listaEl.innerHTML = '';
                    places.forEach((lugar) => {
                        const nombre = lugar.displayName || 'Punto de interés';
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'poi-item';
                        btn.innerHTML = `
                            <strong>${nombre}</strong>
                            <small>${lugar.formattedAddress || 'Cúcuta, Norte de Santander'}</small>
                        `;
                        btn.addEventListener('click', () => {
                            if (lugar.location) elegirPOI(nombre, lugar.location);
                        });
                        listaEl.appendChild(btn);
                    });
                } else {
                    cargarPOIsRespaldo(listaEl);
                }
            } catch (error) {
                console.warn('Usando lista local de respaldo para POI:', error);
                cargarPOIsRespaldo(listaEl);
            }
        }

        function activarSeleccion(cual) {
            modoSeleccion = cual;
            if (esMovil()) abrirMenu(false);          // en el celular se cierra el menú para poder tocar el mapa
            mapa.setOptions({ draggableCursor: 'crosshair' });
            clearTimeout(temporizadorAviso);
            const aviso = document.getElementById('aviso-mapa');
            aviso.textContent = (esMovil() ? 'Toca el mapa' : 'Haz clic en el mapa') + ' para elegir el ' + cual;
            aviso.style.borderColor = '#00d2ff';
            aviso.dataset.seleccion = '1';
            aviso.style.display = 'block';
        }

        function cancelarSeleccion() {
            modoSeleccion = null;
            mapa.setOptions({ draggableCursor: '' });
            delete document.getElementById('aviso-mapa').dataset.seleccion;
            document.getElementById('aviso-mapa').style.display = 'none';
        }

        function usarMiUbicacion() {
            if (!navigator.geolocation) {
                alert('Tu navegador no permite obtener la ubicación.');
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const punto = new google.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
                    fijarPunto('origen', punto, 'Mi ubicación actual');
                    mapa.panTo(punto);
                    mapa.setZoom(16);
                    seguirUsuario();
                },
                () => alert('No se pudo obtener tu ubicación. Revisa el permiso del navegador.'),
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function seguirUsuario() {
            if (idSeguimiento !== null) return;
            idSeguimiento = navigator.geolocation.watchPosition((pos) => {
                const punto = new google.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
                if (!marcadorUsuario) {
                    marcadorUsuario = new google.maps.Marker({
                        position: punto, map: mapa, title: 'Tú', zIndex: 999,
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE, scale: 8,
                            fillColor: '#00d2ff', fillOpacity: 1,
                            strokeColor: '#ffffff', strokeWeight: 3
                        }
                    });
                } else {
                    marcadorUsuario.setPosition(punto);
                }
            }, () => {}, { enableHighAccuracy: true });
        }


        async function iniciarMapa() {
            const cucuta = { lat: 7.89391, lng: -72.50782 };

            const opcionesMapa = {
                zoom: 13,
                center: cucuta,
                disableDefaultUI: true,
                styles: [
                    { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
                    { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
                    { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
                    { featureType: "landscape.man_made", elementType: "geometry", stylers: [{ color: "#2b3648" }] },
                    { featureType: "poi", elementType: "labels.text.fill", stylers: [{ color: "#d59563" }] },
                    { featureType: "poi.park", elementType: "geometry", stylers: [{ color: "#263c3f" }] },
                    { featureType: "road", elementType: "geometry", stylers: [{ color: "#38414e" }] },
                    { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#212a37" }] },
                    { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#9ca5b3" }] },
                    { featureType: "road.highway", elementType: "geometry", stylers: [{ color: "#746855" }] },
                    { featureType: "road.highway", elementType: "geometry.stroke", stylers: [{ color: "#1f2835" }] },
                    { featureType: "transit", elementType: "geometry", stylers: [{ color: "#2f3948" }] },
                    { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] }
                ]
            };

            mapa = new google.maps.Map(document.getElementById("mapa-cucuta"), opcionesMapa);
            iconOrigen = {
                url: 'assets/icons/origen.svg',
                scaledSize: new google.maps.Size(52, 52),
                anchor: new google.maps.Point(26, 44) // Punta exacta del pin escalado
            };
            iconDestino = {
                url: 'assets/icons/destino.svg',
                scaledSize: new google.maps.Size(52, 52),
                anchor: new google.maps.Point(26, 44) // Punta exacta del pin escalado
            };
            iconBuseta = {
                url: 'assets/icons/bus.svg',
                scaledSize: new google.maps.Size(46, 46),
                anchor: new google.maps.Point(23, 23) // Centro exacto del círculo
            };
            iconCaminata = {
                url: 'assets/icons/caminata.svg',
                scaledSize: new google.maps.Size(46, 46),
                anchor: new google.maps.Point(23, 23) // Centro exacto del círculo
            };

            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({
                map: mapa,
                suppressMarkers: true,
                polylineOptions: {
                    strokeColor: '#00d2ff',
                    strokeWeight: 6,
                    strokeOpacity: 0.9
                }
            });

            await google.maps.importLibrary("places");

            const restriccionCucuta = {
                north: 8.05,
                south: 7.75,
                east: -72.40,
                west: -72.65
            };
            
            const autocompleteOrigen = document.createElement('gmp-place-autocomplete');
            autocompleteOrigen.setAttribute('placeholder', '¿Dónde estás? (Punto A)');
            autocompleteOrigen.includedRegionCodes = ['co'];
            autocompleteOrigen.locationRestriction = restriccionCucuta;
            document.getElementById('contenedor-origen').appendChild(autocompleteOrigen);

            const autocompleteDestino = document.createElement('gmp-place-autocomplete');
            autocompleteDestino.setAttribute('placeholder', '¿A dónde vas? (Punto B)');
            autocompleteDestino.includedRegionCodes = ['co'];
            autocompleteDestino.locationRestriction = restriccionCucuta;
            document.getElementById('contenedor-destino').appendChild(autocompleteDestino);

            autocompleteOrigen.addEventListener('gmp-select', async ({ placePrediction }) => {
                try {
                    const place = placePrediction.toPlace();
                    await place.fetchFields({ fields: ['location', 'formattedAddress'] });
                    fijarPunto('origen', place.location, place.formattedAddress);
                } catch (e) { console.error('Error al leer el origen:', e); }
            });

            autocompleteDestino.addEventListener('gmp-select', async ({ placePrediction }) => {
                try {
                    const place = placePrediction.toPlace();
                    await place.fetchFields({ fields: ['location', 'formattedAddress'] });
                    fijarPunto('destino', place.location, place.formattedAddress);
                } catch (e) { console.error('Error al leer el destino:', e); }
            });

            document.getElementById('btn-toggle-poi').addEventListener('click', () => {
                const lista = document.getElementById('lista-poi');
                const abierto = lista.classList.toggle('abierto');
                document.getElementById('btn-toggle-poi').setAttribute('aria-expanded', String(abierto));
                document.getElementById('flecha-poi').textContent = abierto ? '▴' : '▾';
            });

            cargarPuntosDeInteresGoogle();

            mapa.addListener('click', async (e) => {
                if (!modoSeleccion) return;
                if (e.placeId) e.stop();
                const cual = modoSeleccion;
                cancelarSeleccion();
                const direccion = await describirPunto(e.latLng);
                fijarPunto(cual, e.latLng, direccion);
                if (esMovil()) abrirMenu(true);       // se vuelve a abrir el menú para ver el punto elegido
            });

            document.getElementById('btn-origen-mapa').addEventListener('click', () => activarSeleccion('origen'));
            document.getElementById('btn-destino-mapa').addEventListener('click', () => activarSeleccion('destino'));
            document.getElementById('btn-mi-ubicacion').addEventListener('click', usarMiUbicacion);

            // --- AQUI MODIFICAMOS EL BOTON DE BUSCAR RUTA ---
            document.getElementById('btn-buscar-ruta').addEventListener('click', () => {
                if (!coordenadaOrigen || !coordenadaDestino) {
                    alert('Elige un origen y un destino (escribiéndolos, desde el mapa o con tu ubicación).');
                    return;
                }
                reiniciarLeyenda();
                if (esMovil()) abrirMenu(false);       // en el celular se cierra el menú para ver el mapa
                // Dibuja la línea blanca de referencia por las calles
                trazarRutaPorCalles(coordenadaOrigen, coordenadaDestino);
                
                // Le pide a Python la buseta más cercana
                buscarBusetaBackend(coordenadaOrigen, coordenadaDestino);
            });
        }

        let capas = [];

        function limpiarCapas() {
            capas.forEach(c => c.setMap(null));
            capas = [];
        }

        async function trazarRutaPorCalles(origen, destino) {
            limpiarCapas();

            try {
                const a = new google.maps.LatLng(origen);
                const b = new google.maps.LatLng(destino);

                const url = 'https://router.project-osrm.org/route/v1/driving/' +
                    a.lng() + ',' + a.lat() + ';' + b.lng() + ',' + b.lat() +
                    '?overview=full&geometries=geojson';

                const respuesta = await fetch(url);
                const datos = await respuesta.json();
                if (datos.code !== 'Ok' || !datos.routes.length) throw new Error(datos.code);

                const camino = datos.routes[0].geometry.coordinates.map(c => ({ lat: c[1], lng: c[0] }));

                capas.push(new google.maps.Polyline({
                    path: camino,
                    map: mapa,
                    strokeColor: '#ffffff',
                    strokeOpacity: 0.6,
                    strokeWeight: 4,
                    zIndex: 1
                }));

                // Muestra la distancia de la línea blanca en la leyenda
                const distDirectaKm = (datos.routes[0].distance / 1000).toFixed(1);
                document.getElementById('leyenda-directa').textContent = 
                    `Trayecto directo: ${distDirectaKm} km`;

                const limites = new google.maps.LatLngBounds();
                camino.forEach(p => limites.extend(p));
                mapa.fitBounds(limites, margenesMapa());
                aplicarVisibilidad();

            } catch (e) {
                console.error('Ruta por calles falló:', e);
                trazarLineaAB(origen, destino);
            }
        }

        function trazarLineaAB(origen, destino) {
            limpiarCapas();

            capas.push(new google.maps.Polyline({
                path: [origen, destino],
                map: mapa,
                strokeOpacity: 0,
                icons: [{
                    icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, strokeColor: '#ffffff', scale: 3 },
                    offset: '0',
                    repeat: '14px'
                }]
            }));

            const limites = new google.maps.LatLngBounds();
            limites.extend(origen);
            limites.extend(destino);
            mapa.fitBounds(limites, margenesMapa());
            aplicarVisibilidad();
        }

        // --- CONEXION CON EL SERVIDOR PYTHON (ruta de la buseta) ---

        let capasBuseta = [];
        let capasCaminata = [];
        let temporizadorAviso = null;
        let animacionBusetaId = null;
        let controladorPeticion = null;

        function limpiarBuseta() {
            if (animacionBusetaId !== null) {
                cancelAnimationFrame(animacionBusetaId);
                animacionBusetaId = null;
            }
            capasBuseta.forEach(c => c.setMap(null));
            capasBuseta = [];
            capasCaminata.forEach(c => c.setMap(null));
            capasCaminata = [];
        }

        function mostrarAviso(texto, color) {
            const aviso = document.getElementById('aviso-mapa');
            aviso.textContent = texto;
            aviso.style.borderColor = color || '#00d2ff';
            aviso.style.display = 'block';
            clearTimeout(temporizadorAviso);
            temporizadorAviso = setTimeout(() => { aviso.style.display = 'none'; }, 20000);
        }

        // El resumen queda fijo en el menú; el aviso solo se muestra si el menú está cerrado
        function escribirResumen(texto, color) {
            const resumen = document.getElementById('resumen-ruta');
            resumen.textContent = texto;
            resumen.style.borderLeftColor = color || '#00d2ff';
        }

        function anunciar(texto, color) {
            escribirResumen(texto, color);
            if (!document.body.classList.contains('menu-abierto')) mostrarAviso(texto, color);
        }

        async function buscarBusetaBackend(origen, destino) {
            if (controladorPeticion) controladorPeticion.abort();
            controladorPeticion = new AbortController();

            limpiarBuseta();
            try {
                const respuesta = await fetch('https://ruseta-mvp.onrender.com/api/buscar-ruta-buseta',  {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    signal: controladorPeticion.signal,
                    body: JSON.stringify({
                        lat_origen: origen.lat(),
                        lng_origen: origen.lng(),
                        lat_destino: destino.lat(),
                        lng_destino: destino.lng()
                    })
                });
                if (!respuesta.ok) throw new Error('El servidor respondió ' + respuesta.status);

                const datos = await respuesta.json();
                if (datos.encontrada) {
                    limpiarBuseta();
                    dibujarBuseta(datos, origen, destino);
                } else {
                    anunciar(datos.mensaje, '#ffd166');
                }
            } catch (error) {
                if (error.name === 'AbortError') return;
                console.error('Error conectando con el backend:', error);
                anunciar('No se pudo consultar las busetas. El servidor puede estar despertando: intenta de nuevo en unos segundos.', '#ff6b6b');
            }
        }

        function animarMarcadorEnRuta(marcador, puntos) {
            if (puntos.length < 2) return;
            let indice = 0;
            let progreso = 0;
            const velocidad = 0.035;

            function paso() {
                if (indice >= puntos.length - 1) {
                    indice = 0;
                    progreso = 0;
                }

                const p1 = puntos[indice];
                const p2 = puntos[indice + 1];

                const lat = p1.lat + (p2.lat - p1.lat) * progreso;
                const lng = p1.lng + (p2.lng - p1.lng) * progreso;
                marcador.setPosition({ lat, lng });

                progreso += velocidad;
                if (progreso >= 1) {
                    progreso = 0;
                    indice++;
                }

                animacionBusetaId = requestAnimationFrame(paso);
            }
            animacionBusetaId = requestAnimationFrame(paso);
        }

        async function obtenerCaminoPeatonal(desde, hasta) {
            try {
                const a = new google.maps.LatLng(desde);
                const b = new google.maps.LatLng(hasta);
                const url = 'https://routing.openstreetmap.de/routed-foot/route/v1/foot/' +
                    a.lng() + ',' + a.lat() + ';' + b.lng() + ',' + b.lat() +
                    '?overview=full&geometries=geojson';

                const respuesta = await fetch(url);
                const datos = await respuesta.json();
                if (datos.code === 'Ok' && datos.routes.length) {
                    return datos.routes[0].geometry.coordinates.map(c => ({ lat: c[1], lng: c[0] }));
                }
            } catch (e) {
                console.warn('No se pudo calcular caminata por calles, usando línea recta.');
            }
            return [desde, hasta];
        }

        async function dibujarBuseta(datos, origen, destino) {
            // 1. Tramo de la buseta
            capasBuseta.push(new google.maps.Polyline({
                path: datos.puntos, map: mapa,
                strokeColor: '#00d2ff', strokeOpacity: 1, strokeWeight: 6, zIndex: 999
            }));

            // 2. Caminatas reales por las calles
            const coordOrigen = { lat: origen.lat(), lng: origen.lng() };
            const coordDestino = { lat: destino.lat(), lng: destino.lng() };

            const [caminoSubida, caminoBajada] = await Promise.all([
                obtenerCaminoPeatonal(coordOrigen, datos.subida),
                obtenerCaminoPeatonal(datos.bajada, coordDestino)
            ]);

            // Cada caminata lleva un halo oscuro (se distingue de las otras líneas) y puntos amarillos redondos
            const crearLineaCaminata = (rutaPeatonal) => [
                new google.maps.Polyline({
                    path: rutaPeatonal, map: mapa,
                    strokeColor: '#0b1d3a', strokeOpacity: 0.55, strokeWeight: 7, zIndex: 997
                }),
                new google.maps.Polyline({
                    path: rutaPeatonal, map: mapa, strokeOpacity: 0, zIndex: 998,
                    icons: [{
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            fillColor: '#ffd166', fillOpacity: 1,
                            strokeColor: '#0b1d3a', strokeOpacity: 1, strokeWeight: 1,
                            scale: 2.6
                        },
                        offset: '0',
                        repeat: '11px'
                    }]
                })
            ];

            capasCaminata.push(...crearLineaCaminata(caminoSubida), ...crearLineaCaminata(caminoBajada));

            // 3. Punto de subida (círculo cian) y punto de bajada (ícono de persona caminando)
            capasBuseta.push(new google.maps.Marker({
                position: datos.subida,
                map: mapa,
                title: 'Sube a la buseta aquí',
                zIndex: 1000,
                icon: {
                    path: google.maps.SymbolPath.CIRCLE, scale: 7,
                    fillColor: '#00d2ff', fillOpacity: 1, strokeColor: '#ffffff', strokeWeight: 2
                }
            }));

            capasBuseta.push(new google.maps.Marker({
                position: datos.bajada,
                map: mapa,
                icon: iconCaminata,
                title: 'Baja aquí y camina hacia tu destino',
                zIndex: 1001
            }));

            // 4. Icono único de la buseta recorriendo el tramo
            const marcadorBus = new google.maps.Marker({
                position: datos.subida,
                map: mapa,
                icon: iconBuseta,
                title: datos.nombre_ruta,
                zIndex: 1001
            });
            capasBuseta.push(marcadorBus);
            animarMarcadorEnRuta(marcadorBus, datos.puntos);

            // 5. Encuadre de cámara
            const limites = new google.maps.LatLngBounds();
            datos.puntos.forEach(p => limites.extend(p));
            limites.extend(origen);
            limites.extend(destino);
            mapa.fitBounds(limites, margenesMapa());
            aplicarVisibilidad();

            // 6. Actualizar distancias en la caja de leyenda
            const distBusetaKm = (datos.viaje_m / 1000).toFixed(1);
            const totalCaminataM = datos.caminata_origen_m + datos.caminata_destino_m;

            document.getElementById('leyenda-buseta').textContent = 
                `Recorrido de la buseta: ${distBusetaKm} km`;
            document.getElementById('leyenda-caminata').textContent = 
                `Caminata a pie: ${totalCaminataM} m (${datos.caminata_origen_m} m + ${datos.caminata_destino_m} m)`;

            // 7. Resumen superior
            let nota = '';
            if (datos.radio_usado_m > 500) nota += ' · caminata larga';
            if (datos.sentido_por_confirmar) nota += ' · sentido por confirmar';
            const nombre = datos.ref ? datos.ref + ' · ' + datos.nombre_ruta : datos.nombre_ruta;
            anunciar('🚌 ' + nombre + ': caminas ' + datos.caminata_origen_m + ' m, viajas ' +
                distBusetaKm + ' km y caminas ' + datos.caminata_destino_m +
                ' m (≈ ' + datos.minutos_estimados + ' min)' + nota, '#00d2ff');
        }
    </script>
