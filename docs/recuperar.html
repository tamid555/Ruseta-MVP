<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruseta - Recuperar contraseña</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <h1 class="logo-text">RUSETA</h1>
            <p class="subtitle" id="subtitulo">Recupera tu contraseña</p>

            <form id="paso1Form">
                <div class="form-group">
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                        </svg>
                        <input type="email" id="emailRecuperar" placeholder="Ingresa tu correo registrado" class="input-field">
                    </div>

                    <p id="msgPaso1" class="msg-error"></p>
                    <button type="button" class="btn-primary" id="btnEnviarCodigo">ENVIAR CÓDIGO</button>
                </div>
            </form>

            <form id="paso2Form" style="display: none;">
                <div class="form-group">
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                        </svg>
                        <input type="text" id="codigo" placeholder="Código de 6 dígitos" maxlength="6" class="input-field">
                    </div>

                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                        <input type="password" id="nuevaPassword" placeholder="Nueva contraseña (mín. 6 caracteres)" class="input-field">
                    </div>

                    <p id="msgPaso2" class="msg-error"></p>
                    <button type="button" class="btn-primary" id="btnCambiarPassword">RESTABLECER CONTRASEÑA</button>
                </div>
            </form>

            <p class="enlace-registro"><a href="index.html">Volver al inicio de sesión</a></p>
        </div>
    </div>

    <script src="js/recuperar.js"></script>
</body>
</html>
