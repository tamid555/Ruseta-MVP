<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruseta - Cúcuta</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <h1 class="logo-text">RUSETA</h1>
            <p class="subtitle">Transporte y rutas en Cúcuta</p>

            <form id="loginForm">
                <div class="form-group">
                    
                    <!-- Campo de Correo con Ícono -->
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                        <input type="email" id="email" placeholder="Correo electrónico" class="input-field">
                    </div>

                    <!-- Campo de Contraseña con Ícono -->
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                        <input type="password" id="password" placeholder="Contraseña" class="input-field">
                    </div>

                    <button type="button" class="btn-primary" id="btnLogin">INICIAR SESIÓN</button>
                </div>

                <div class="divider">O</div>

                <button type="button" class="btn-guest" id="btnGuest">Continuar como Invitado</button>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
