<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruseta - Mapa de Rutas</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #mapa-cucuta {
            width: 100%;
            height: 100%;
        }

        /* Botón de Cerrar Sesión */
        .btn-cerrar-sesion {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background-color: #00d2ff;
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: background 0.3s ease;
        }

        .btn-cerrar-sesion:hover {
            background-color: #3a86ff;
            color: #ffffff;
        }

        /* Panel Flotante de Planificación */
        .panel-viaje {
            position: absolute;
            top: 80px;
            left: 20px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            width: 340px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .panel-viaje h3 {
            color: #ffffff;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .input-grupo {
            position: relative;
            margin-bottom: 12px;
        }

        /* Adaptación visual para el componente web de Google */
        gmp-place-autocomplete {
            width: 100%;
            --gmp-color-background: #1e293b;
            --gmp-color-text: #ffffff;
            --gmp-color-border: #334155;
            --gmp-border-radius: 8px;
            --gmp-box-shadow: none;
            font-size: 0.9rem;
        }

        .btn-trazar {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #00d2ff, #3a86ff);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 5px;
        }

        .btn-trazar:hover {
            opacity: 0.9;
        }
        .fila-botones { display: flex; gap: 8px; margin-bottom: 6px; }
.btn-mini {
    flex: 1; padding: 7px 8px; background: #1e293b; color: #ffffff;
    border: 1px solid #334155; border-radius: 8px; cursor: pointer; font-size: 0.8rem;
}
.btn-mini:hover { border-color: #00d2ff; }
.texto-punto { color: #a6e4ff; font-size: 0.8rem; margin-bottom: 12px; word-break: break-word; }
.aviso-mapa {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: rgba(15, 23, 42, 0.9); color: #ffffff; padding: 10px 18px;
    border-radius: 8px; border: 1px solid #00d2ff; display: none;
}
    </style>

</head>
<body>

    <button class="btn-cerrar-sesion" onclick="cerrarSesion()">Cerrar Sesión</button>

    <div class="panel-viaje">
    <h3>Planifica tu viaje</h3>

    <div class="input-grupo" id="contenedor-origen"></div>
    <div class="fila-botones">
        <button class="btn-mini" id="btn-origen-mapa">📍 Elegir en el mapa</button>
        <button class="btn-mini" id="btn-mi-ubicacion">🎯 Mi ubicación</button>
    </div>
    <div class="texto-punto" id="texto-origen">Origen: sin seleccionar</div>

    <div class="input-grupo" id="contenedor-destino"></div>
    <div class="fila-botones">
        <button class="btn-mini" id="btn-destino-mapa">📍 Elegir en el mapa</button>
    </div>
    <div class="texto-punto" id="texto-destino">Destino: sin seleccionar</div>

    <button class="btn-trazar" id="btn-buscar-ruta">Trazar Ruta</button>
</div>

<div class="aviso-mapa" id="aviso-mapa"></div>
<div id="mapa-cucuta"></div>

    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCnEK5NvabRa4y36ZJCeRjLmJforPtaK5w&libraries=places&v=weekly&callback=iniciarMapa"></script>

    <script>
        if (!sessionStorage.getItem('usuarioRuseta')) {
            window.location.href = 'index.html';
        }

        function cerrarSesion() {
            sessionStorage.removeItem('usuarioRuseta');
            window.location.href = 'index.html';
        }

        let mapa;
        let directionsService;
        let directionsRenderer;
        
        let coordenadaOrigen = null;
        let coordenadaDestino = null;
        
        

        let iconOrigen, iconDestino, iconBuseta;

        function crearMarcador(posicion, icono, titulo) {
            return new google.maps.Marker({
                position: posicion,
                map: mapa,
                icon: icono,
                title: titulo,
                animation: google.maps.Animation.DROP
            });
        }
let modoSeleccion = null;                       // 'origen' | 'destino' | null
const marcadoresPunto = { origen: null, destino: null };
let marcadorUsuario = null;
let idSeguimiento = null;

function textoCoordenadas(p) {
    return p.lat().toFixed(5) + ', ' + p.lng().toFixed(5);
}

// Intenta obtener la dirección; si falla, muestra las coordenadas
async function describirPunto(latLng) {
    try {
        const { results } = await new google.maps.Geocoder().geocode({ location: latLng });
        if (results && results[0]) return results[0].formatted_address;
    } catch (e) {
        // Geocoding API no activada o sin resultados: se usan las coordenadas
    }
    return textoCoordenadas(latLng);
}

function fijarPunto(cual, latLng, texto) {
    const esOrigen = cual === 'origen';
    if (esOrigen) coordenadaOrigen = latLng; else coordenadaDestino = latLng;

    if (marcadoresPunto[cual]) marcadoresPunto[cual].setMap(null);
    marcadoresPunto[cual] = crearMarcador(
        latLng, esOrigen ? iconOrigen : iconDestino, esOrigen ? 'Punto A' : 'Punto B'
    );

    document.getElementById('texto-' + cual).textContent =
        (esOrigen ? 'Origen: ' : 'Destino: ') + (texto || textoCoordenadas(latLng));
}

function activarSeleccion(cual) {
    modoSeleccion = cual;
    mapa.setOptions({ draggableCursor: 'crosshair' });
    const aviso = document.getElementById('aviso-mapa');
    aviso.textContent = 'Haz clic en el mapa para elegir el ' + cual;
    aviso.style.display = 'block';
}

function cancelarSeleccion() {
    modoSeleccion = null;
    mapa.setOptions({ draggableCursor: '' });
    document.getElementById('aviso-mapa').style.display = 'none';
}

function usarMiUbicacion() {
    if (!navigator.geolocation) {
        alert('Tu navegador no permite obtener la ubicación.');
        return;
    }
    navigator.geolocation.getCurrentPosition(
        (pos) => {
            const punto = new google.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
            fijarPunto('origen', punto, 'Mi ubicación actual');
            mapa.panTo(punto);
            mapa.setZoom(16);
            seguirUsuario();
        },
        () => alert('No se pudo obtener tu ubicación. Revisa el permiso del navegador.'),
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

// Punto celeste que se mueve con el usuario (ubicación en tiempo real)
function seguirUsuario() {
    if (idSeguimiento !== null) return;
    idSeguimiento = navigator.geolocation.watchPosition((pos) => {
        const punto = new google.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
        if (!marcadorUsuario) {
            marcadorUsuario = new google.maps.Marker({
                position: punto, map: mapa, title: 'Tú', zIndex: 999,
                icon: {
                    path: google.maps.SymbolPath.CIRCLE, scale: 8,
                    fillColor: '#00d2ff', fillOpacity: 1,
                    strokeColor: '#ffffff', strokeWeight: 3
                }
            });
        } else {
            marcadorUsuario.setPosition(punto);
        }
    }, () => {}, { enableHighAccuracy: true });
}


        async function iniciarMapa() {
            const cucuta = { lat: 7.89391, lng: -72.50782 };

            const opcionesMapa = {
                zoom: 13,
                center: cucuta,
                disableDefaultUI: true,
                styles: [
                    { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
                    { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
                    { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
                    { featureType: "landscape.man_made", elementType: "geometry", stylers: [{ color: "#2b3648" }] },
                    { featureType: "poi", elementType: "labels.text.fill", stylers: [{ color: "#d59563" }] },
                    { featureType: "poi.park", elementType: "geometry", stylers: [{ color: "#263c3f" }] },
                    { featureType: "road", elementType: "geometry", stylers: [{ color: "#38414e" }] },
                    { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#212a37" }] },
                    { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#9ca5b3" }] },
                    { featureType: "road.highway", elementType: "geometry", stylers: [{ color: "#746855" }] },
                    { featureType: "road.highway", elementType: "geometry.stroke", stylers: [{ color: "#1f2835" }] },
                    { featureType: "transit", elementType: "geometry", stylers: [{ color: "#2f3948" }] },
                    { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] }
                ]
            };

            mapa = new google.maps.Map(document.getElementById("mapa-cucuta"), opcionesMapa);
            iconOrigen = {
    url: 'assets/icons/origen.svg',
    scaledSize: new google.maps.Size(40, 40),
    anchor: new google.maps.Point(20, 40)
};
iconDestino = {
    url: 'assets/icons/destino.svg',
    scaledSize: new google.maps.Size(40, 40),
    anchor: new google.maps.Point(20, 40)
};
iconBuseta = {
    url: 'assets/icons/bus.svg',
    scaledSize: new google.maps.Size(35, 35),
    anchor: new google.maps.Point(17, 17)
};


            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({
                map: mapa,
                suppressMarkers: true,
                polylineOptions: {
                    strokeColor: '#00d2ff',
                    strokeWeight: 6,
                    strokeOpacity: 0.9
                }
            });

            await google.maps.importLibrary("places");

            // Delimitación geográfica exacta para Cúcuta, Colombia
            const restriccionCucuta = {
                north: 8.05,
                south: 7.75,
                east: -72.40,
                west: -72.65
            };
            // Autocompletado Origen
            const autocompleteOrigen = document.createElement('gmp-place-autocomplete');
            autocompleteOrigen.setAttribute('placeholder', '¿Dónde estás? (Punto A)');
            autocompleteOrigen.includedRegionCodes = ['co'];
            autocompleteOrigen.locationRestriction = restriccionCucuta;
            document.getElementById('contenedor-origen').appendChild(autocompleteOrigen);

            // Autocompletado Destino
            const autocompleteDestino = document.createElement('gmp-place-autocomplete');
            autocompleteDestino.setAttribute('placeholder', '¿A dónde vas? (Punto B)');
            autocompleteDestino.includedRegionCodes = ['co'];
            autocompleteDestino.locationRestriction = restriccionCucuta;
            document.getElementById('contenedor-destino').appendChild(autocompleteDestino);

          
            autocompleteOrigen.addEventListener('gmp-select', async ({ placePrediction }) => {
    try {
        const place = placePrediction.toPlace();
        await place.fetchFields({ fields: ['location', 'formattedAddress'] });
        fijarPunto('origen', place.location, place.formattedAddress);
    } catch (e) { console.error('Error al leer el origen:', e); }
});

autocompleteDestino.addEventListener('gmp-select', async ({ placePrediction }) => {
    try {
        const place = placePrediction.toPlace();
        await place.fetchFields({ fields: ['location', 'formattedAddress'] });
        fijarPunto('destino', place.location, place.formattedAddress);
    } catch (e) { console.error('Error al leer el destino:', e); }
});

// Clic en el mapa (solo actúa si se activó "Elegir en el mapa")
mapa.addListener('click', async (e) => {
    if (!modoSeleccion) return;
    if (e.placeId) e.stop();            // evita la ventanita de lugares de Google
    const cual = modoSeleccion;
    cancelarSeleccion();
    const direccion = await describirPunto(e.latLng);
    fijarPunto(cual, e.latLng, direccion);
});

document.getElementById('btn-origen-mapa').addEventListener('click', () => activarSeleccion('origen'));
document.getElementById('btn-destino-mapa').addEventListener('click', () => activarSeleccion('destino'));
document.getElementById('btn-mi-ubicacion').addEventListener('click', usarMiUbicacion);

document.getElementById('btn-buscar-ruta').addEventListener('click', () => {
    if (!coordenadaOrigen || !coordenadaDestino) {
        alert('Elige un origen y un destino (escribiéndolos, desde el mapa o con tu ubicación).');
        return;
    }
    trazarLineaAB(coordenadaOrigen, coordenadaDestino);
});
}

let capas = [];   // todo lo que dibujamos, para borrarlo al trazar de nuevo

function limpiarCapas() {
    capas.forEach(c => c.setMap(null));
    capas = [];
}

function trazarLineaAB(origen, destino) {
    limpiarCapas();

    capas.push(new google.maps.Polyline({
        path: [origen, destino],
        map: mapa,
        strokeOpacity: 0,
        icons: [{
            icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, strokeColor: '#ffffff', scale: 3 },
            offset: '0',
            repeat: '14px'
        }]
    }));

    const limites = new google.maps.LatLngBounds();
    limites.extend(origen);
    limites.extend(destino);
    mapa.fitBounds(limites, { top: 80, right: 80, bottom: 80, left: 400 });
}
    </script>
</body>
</html>
